name: Зинаида — недвижимость у воды

on:
  schedule:
    - cron: '17 5 * * *' # 08:17 МСК; отдельный выпуск после основной газеты
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'gazeta/property_monitor.py'
      - 'gazeta/test_property_monitor.py'
      - 'config/property_sources.json'
      - '.github/workflows/property-monitor.yml'

permissions:
  contents: read

concurrency:
  group: zinaida-property-monitor
  cancel-in-progress: false

jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Проверка отбора, экранирования и повторной доставки
        run: |
          python -m py_compile gazeta/property_monitor.py
          python -m unittest gazeta.test_property_monitor -v
      - name: Восстановить историю источников и отправок
        id: state
        uses: actions/cache/restore@v4
        with:
          path: .property-state
          key: property-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: property-state-v1-
      - name: Найти предложения и отправить в Telegram
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL }}
          ZAI_MODEL: ${{ secrets.ZAI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gazeta/property_monitor.py
      - name: Сохранить историю, включая частично доставленный выпуск
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .property-state
          key: property-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
